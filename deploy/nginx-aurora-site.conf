# Aurora's World 站点示例配置
#
# 用法：
#   1. 复制到 /etc/nginx/sites-available/aurora-site.conf（路径按发行版调整）
#   2. 把 server_name 与 root 改成自己的域名和部署目录
#   3. ln -s /etc/nginx/sites-available/aurora-site.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 前端与 /api 同域，因此后端不需要开启 CORS。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    root /opt/my_website/aurora-site;
    index index.html;

    # 单页站点：找不到实体文件时回退到首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态根指向仓库目录时，禁止访问 .git 等隐藏路径
    location ~ /\. {
        deny all;
    }

    # 同源 API：转发到本机 FastAPI（proxy_pass 不带尾部斜杠，保留 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存（改动样式/脚本后配合文件名或强制刷新）
    location ~* \.(?:css|js|jpg|jpeg|png|svg|ico|pdf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 如需对外暴露 Swagger / ReDoc，取消下面注释
    # location /docs {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    # }
    # location /openapi.json {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    # }

    # HTTPS 建议用 certbot 自动生成 443 配置并追加跳转：
    #   certbot --nginx -d your-domain.com
}
